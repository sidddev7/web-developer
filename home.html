    :root {

    /* Navigation */

      background-clip: text;
      text-decoration: none;

    .nav-menu {

    .nav-link::after {
      content: '';

      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--gradient);
      transition: width 0.3s ease;

    .nav-link:hover {
      color: var(--text-primary);
    }
    
    .nav-link:hover::after,

      width: 100%;

    .nav-link.active {
      color: var(--primary-color);

      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
      pointer-events: none;
      /* Ensure it doesn't cause overflow - parent has overflow: hidden */

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }

        font-size: 0.85rem;
        min-height: 46px;
      }
    }
    
    .btn-primary {
      background: var(--gradient);
      color: var(--text-primary);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
    }
    
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(99, 102, 241, 0.35);
    }
    
    .btn-outline {
      border: 2px solid var(--secondary-color);
      color: var(--secondary-color);
      background: transparent;
    }
    
    .btn-outline:hover {
      background: var(--secondary-color);
      color: var(--bg-primary);
      transform: translateY(-3px);
    }
    
    .social-links {

    @media (max-width: 768px) {

    .social-link {

    @media (max-width: 768px) {

    /* Section Styles */
    .section {

    }
    
    .section-title span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* About Section */
    .about-content {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 4rem;
      align-items: center;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    
    @media (max-width: 768px) {
      .about-content {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
    }
    
    .about-image {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 100%;
    }
    
    .about-image img {
      width: 100%;
      border-radius: 20px;
      border: 3px solid var(--border-color);
      transition: all 0.3s ease;
      display: block;
      max-width: 100%;
    }
    
    .about-image::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 20px;
      width: calc(100% - 20px);
      height: calc(100% - 20px);
      border: 3px solid var(--secondary-color);
      border-radius: 20px;
      z-index: -1;
      opacity: 0.5;
      pointer-events: none;
      box-sizing: border-box;
    }
    
    @media (max-width: 768px) {
      .about-image::before {
        top: 15px;
        left: 15px;
        width: calc(100% - 15px);
        height: calc(100% - 15px);
      }
    }
    
    @media (max-width: 480px) {
      .about-image::before {
        top: 10px;
        left: 10px;
        width: calc(100% - 10px);
        height: calc(100% - 10px);
      }
    }
    
    .about-text h3 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      color: var(--secondary-color);
    }
    
    .about-text p {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.8;
    }
    
    .about-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin: 2rem 0;
    }
    
    .info-item {
      padding: 1rem;
      background: var(--bg-card);
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    
    .info-item strong {
      color: var(--secondary-color);
      display: block;
      margin-bottom: 0.5rem;
    }
    
    /* Skills Section */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }
    
    @media (max-width: 768px) {

        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }
    
    .skill-card {
      background: var(--bg-card);
      padding: 2rem;
      border-radius: 15px;
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;

    .skill-card:hover {

      border-color: var(--secondary-color);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
    }
    
    .skill-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .skill-icon {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    
    .skill-name {
      font-size: 1.3rem;
      font-weight: 600;
    }
    
    .skill-bar {
      width: 100%;
      height: 8px;
      background: var(--bg-secondary);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 1rem;
    }
    
    .skill-progress {
      height: 100%;
      background: var(--gradient);
      border-radius: 10px;
      transition: width 1s ease;
    }

      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));

      width: 100%;

    @media (max-width: 768px) {

    .portfolio-drawer-btn-secondary:hover {

      border-color: var(--primary-color);
      color: var(--primary-color);
    }
    
    .portfolio-drawer-btn-primary {
      background: var(--gradient);
      color: var(--text-primary);

        left: 0;
        right: 0;
        width: 100%;
        height: 100%;
        top: 0;

      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    .contact-details a:hover {
      color: var(--secondary-color);
    }
    
    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease;
    }
    
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* Prevent horizontal overflow */
    @media (max-width: 768px) {
      body, html {
        overflow-x: hidden !important;
        width: 100% !important;
        max-width: 100vw !important;
      }
      
      * {
        max-width: 100vw;
      }

        top: 70px;
        left: -100%;

        max-width: 100%;

      top: 0;
      left: 0;

      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

        if (dataScript) {
          portfolioData = JSON.parse(dataScript.textContent);
          renderAllContent();
        } else {
          console.error('Portfolio data script tag not found');
        }

        console.error('Error parsing portfolio data:', error);
      }

      const navLogo = document.getElementById('navLogo');
      const navMenu = document.getElementById('navMenu');
      const data = portfolioData.navigation;
      
      navLogo.textContent = data.logo;
      navMenu.innerHTML = '';
      
      data.links.forEach((link, index) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = link.href;
        a.textContent = link.text;
        a.className = 'nav-link' + (index === 0 ? ' active' : '');
        if (link.external) {
          a.target = '_blank';
        }
        li.appendChild(a);
        navMenu.appendChild(li);
      });
    }

                <h4 style="font-size: 1.3rem; margin-bottom: 0.5rem; color: var(--text-primary);">${edu.title}</h4>
                <p style="color: var(--secondary-color); margin-bottom: 0.5rem; font-weight: 500;">${edu.institution}</p>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem;">${edu.period}</p>
                <p style="color: var(--text-secondary); line-height: 1.6;">${edu.description}</p>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="fade-in">
          <h3 style="font-size: 1.8rem; margin-bottom: 2rem; color: var(--secondary-color); display: flex; align-items: center; gap: 1rem;">
            <i class="fas fa-briefcase" style="font-size: 2rem;"></i>
            Experience
          </h3>
          <div style="position: relative; padding-left: 2rem;">
            <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--gradient);"></div>
            ${data.experience.map(exp => `
              <div style="position: relative; margin-bottom: 2.5rem;">
                <div style="position: absolute; left: -2.5rem; top: 0.5rem; width: 12px; height: 12px; border-radius: 50%; background: var(--primary-color); border: 3px solid var(--bg-secondary);"></div>
                <h4 style="font-size: 1.3rem; margin-bottom: 0.5rem; color: var(--text-primary);">${exp.title}</h4>
                <p style="color: var(--secondary-color); margin-bottom: 0.5rem; font-weight: 500;">${exp.company}</p>
                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem;">${exp.period}</p>
                <p style="color: var(--text-secondary); line-height: 1.6;">${exp.description}</p>
              </div>
            `).join('')}
          </div>
          <div style="margin-top: 2rem;">
            <a href="${portfolioData.personal.cvUrl}" target="_blank" class="btn btn-primary">Download CV</a>
          </div>
        </div>
      `;
    }

    // Render Skills Section
    function renderSkills() {
      const skillsGrid = document.getElementById('skillsGrid');
      skillsGrid.innerHTML = '';
      
      portfolioData.skills.forEach(skill => {
        const card = document.createElement('div');
        card.className = 'skill-card fade-in';
        card.innerHTML = `
          <div class="skill-header">
            <div class="skill-icon"><i class="${skill.icon}"></i></div>
            <div class="skill-name">${skill.name}</div>
          </div>
          <div class="skill-bar">
            <div class="skill-progress" data-percent="${skill.percentage}" style="width: 0%;"></div>
          </div>
        `;
        skillsGrid.appendChild(card);
      });
    }

    // Render Portfolio Section
    function renderPortfolio() {
      const data = portfolioData.portfolio;
      
      document.getElementById('portfolioSubtitle').textContent = data.subtitle;
      
      const portfolioGrid = document.getElementById('portfolioGrid');
      portfolioGrid.innerHTML = '';
      
      data.items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'portfolio-item fade-in';
        div.setAttribute('data-portfolio-url', item.url);
        div.setAttribute('data-portfolio-title', item.title);
        div.innerHTML = `
          <img src="${item.image}" alt="${item.title}">
          <div class="portfolio-overlay">
            <h3 class="portfolio-title">${item.title}</h3>
            <span class="portfolio-link">View Project</span>
          </div>
        `;
        portfolioGrid.appendChild(div);
      });
    }

    // Render Contact Section
    function renderContact() {
      const data = portfolioData.personal;
      const contact = portfolioData.contact;
      
      document.getElementById('contactSubtitle').textContent = contact.subtitle;
      
      const contactContent = document.getElementById('contactContent');
      contactContent.innerHTML = `
        <div class="contact-info fade-in">
          <div class="contact-item">
            <div class="contact-icon"><i class="fas fa-user"></i></div>
            <div class="contact-details">
              <h4>Name</h4>
              <p>${data.fullName}</p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
            <div class="contact-details">
              <h4>Location</h4>
              <p>${data.location}</p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-icon"><i class="fas fa-phone"></i></div>
            <div class="contact-details">
              <h4>Call Me</h4>
              <a href="tel:${data.phone}">${data.phone}</a>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-icon"><i class="fas fa-envelope"></i></div>
            <div class="contact-details">
              <h4>Email Me</h4>
              <a href="mailto:${data.email}">${data.email}</a>
            </div>
          </div>
        </div>
        <div class="contact-info fade-in">
          <div style="background: var(--bg-card); padding: 2rem; border-radius: 15px; border: 1px solid var(--border-color);">
            <h3 style="margin-bottom: 1.5rem; color: var(--secondary-color);">${contact.availability.title}</h3>
            <p style="color: var(--text-secondary); line-height: 1.8; margin-bottom: 1.5rem;">${contact.availability.description}</p>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
              ${portfolioData.social.links.map(link => `
                <a href="${link.url}" target="_blank" class="social-link" style="position: static; transform: none;">
                  <i class="${link.icon}"></i>
                </a>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Render all content
    function renderAllContent() {
      renderNavigation();
      renderHero();
      renderAbout();
      renderResume();
      renderSkills();
      renderPortfolio();
      renderContact();
      
      // Initialize typing effect
      initializeTypingEffect();
      
      // Re-initialize portfolio drawer after rendering
      initializePortfolioDrawer();
      
      // Re-initialize skill progress bars
      initializeSkillBars();
    }

    // Initialize skill progress bars
    function initializeSkillBars() {
      const skillObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const progressBar = entry.target;
            const percent = progressBar.getAttribute('data-percent');
            progressBar.style.width = percent + '%';
            skillObserver.unobserve(progressBar);
          }
        });
      }, { threshold: 0.5 });

      document.querySelectorAll('.skill-progress').forEach(bar => {
        skillObserver.observe(bar);
      });
    }

    // Initialize portfolio drawer
    function initializePortfolioDrawer() {
      const portfolioItems = document.querySelectorAll('.portfolio-item[data-portfolio-url]');
      const drawerOverlay = document.getElementById('portfolioDrawerOverlay');
      const drawer = document.getElementById('portfolioDrawer');
      const drawerTitle = document.getElementById('portfolioDrawerTitle');
      const drawerIframe = document.getElementById('portfolioDrawerIframe');
      const drawerLoading = document.getElementById('portfolioDrawerLoading');
      const drawerClose = document.getElementById('portfolioDrawerClose');
      const drawerCloseBtn = document.getElementById('portfolioDrawerCloseBtn');
      const drawerOpenBtn = document.getElementById('portfolioDrawerOpenBtn');

      function openDrawer(url, title) {
        drawerTitle.textContent = title;
        drawerOpenBtn.href = url;
        
        drawerLoading.innerHTML = `
          <div class="portfolio-drawer-spinner"></div>
          <p>Loading project...</p>
        `;
        drawerLoading.style.display = 'flex';
        drawerIframe.style.display = 'none';
        
        drawerOverlay.classList.add('active');
        drawer.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        drawerIframe.src = url;
        
        const loadTimeout = setTimeout(() => {
          if (drawerLoading.style.display !== 'none') {
            drawerLoading.innerHTML = `
              <div style="text-align: center;">
                <i class="fas fa-clock" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
                <p style="margin-bottom: 1rem;">This site is taking longer than expected to load.</p>
                <a href="${url}" target="_blank" class="btn btn-primary">Open in New Tab</a>
              </div>
            `;
          }
        }, 15000);
        
        drawerIframe.onload = () => {
          clearTimeout(loadTimeout);
          drawerLoading.style.display = 'none';
          drawerIframe.style.display = 'block';
        };
        
        drawerIframe.onerror = () => {
          clearTimeout(loadTimeout);
          drawerLoading.innerHTML = `
            <div style="text-align: center;">
              <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
              <p style="margin-bottom: 1rem;">Unable to load this site in the preview.</p>
              <a href="${url}" target="_blank" class="btn btn-primary">Open in New Tab</a>
            </div>
          `;
        };
      }

      function closeDrawer() {
        drawerOverlay.classList.remove('active');
        drawer.classList.remove('active');
        document.body.style.overflow = '';
        
        setTimeout(() => {
          drawerIframe.src = '';
          drawerLoading.style.display = 'flex';
          drawerIframe.style.display = 'none';
        }, 400);
      }

      portfolioItems.forEach(item => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          const url = item.getAttribute('data-portfolio-url');
          const title = item.getAttribute('data-portfolio-title');
          if (url) {
            openDrawer(url, title);
          }
        });
      });

      drawerClose.addEventListener('click', closeDrawer);
      drawerCloseBtn.addEventListener('click', closeDrawer);
      drawerOverlay.addEventListener('click', closeDrawer);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && drawer.classList.contains('active')) {
          closeDrawer();
        }
      });

      drawer.addEventListener('click', (e) => {
        e.stopPropagation();
      });
    }

    // Load data on page load
    loadPortfolioData();

    // Preloader
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      setTimeout(() => {
        preloader.classList.add('hidden');
      }, 500);
    });

    // Navbar scroll effect
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // Mobile menu toggle
    const navToggle = document.getElementById('navToggle');
    const navMenu = document.getElementById('navMenu');
    
    navToggle.addEventListener('click', () => {
      navMenu.classList.toggle('active');
      navToggle.classList.toggle('active');
    });

    // Close menu when clicking on a link
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        navMenu.classList.remove('active');
        navToggle.classList.remove('active');
      });
    });

    // Smooth scrolling - use event delegation
    document.addEventListener('click', function(e) {
      const anchor = e.target.closest('a[href^="#"]');
      if (anchor) {
        const href = anchor.getAttribute('href');
        if (href !== '#' && href.startsWith('#')) {
          e.preventDefault();
          const target = document.querySelector(href);
          if (target) {
            const offsetTop = target.offsetTop - 80; // Account for fixed navbar
            window.scrollTo({
              top: offsetTop,
              behavior: 'smooth'
            });
          }
        }
      }
    });

    // Update active navigation on scroll
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-link[href^="#"]');
    
    function updateActiveNav() {
      let current = '';
      const scrollPosition = window.pageYOffset + 100;
      
      sections.forEach(section => {
        const sectionTop = section.offsetTop;
        const sectionHeight = section.clientHeight;
        if (scrollPosition >= sectionTop && scrollPosition < sectionTop + sectionHeight) {
          current = section.getAttribute('id');
        }
      });
      
      navLinks.forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('href') === `#${current}`) {
          link.classList.add('active');
        }
      });
    }
    
    window.addEventListener('scroll', updateActiveNav);
    updateActiveNav(); // Initial call

    // Typing effect
    function initializeTypingEffect() {
      if (!portfolioData || !portfolioData.hero) return;
      
      const typingText = document.getElementById('typingText');
      const words = portfolioData.hero.typingWords;
      let wordIndex = 0;
      let charIndex = 0;
      let isDeleting = false;

      function type() {
        const currentWord = words[wordIndex];
        
        if (isDeleting) {
          typingText.textContent = currentWord.substring(0, charIndex - 1);
          charIndex--;
        } else {
          typingText.textContent = currentWord.substring(0, charIndex + 1);
          charIndex++;
        }

        if (!isDeleting && charIndex === currentWord.length) {
          isDeleting = true;
          setTimeout(type, 2000);
        } else if (isDeleting && charIndex === 0) {
          isDeleting = false;
          wordIndex = (wordIndex + 1) % words.length;
          setTimeout(type, 500);
        } else {
          setTimeout(type, isDeleting ? 50 : 100);
        }
      }

      type();
    }

    // Scroll animations
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -100px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    document.querySelectorAll('.fade-in').forEach(el => {
      observer.observe(el);
    });

    // Skill progress bars
    const skillObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const progressBar = entry.target;
          const percent = progressBar.getAttribute('data-percent');
          progressBar.style.width = percent + '%';
          skillObserver.unobserve(progressBar);
        }
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('.skill-progress').forEach(bar => {
      skillObserver.observe(bar);
    });

    // Portfolio Drawer Functionality
    const portfolioItems = document.querySelectorAll('.portfolio-item[data-portfolio-url]');
    const drawerOverlay = document.getElementById('portfolioDrawerOverlay');
    const drawer = document.getElementById('portfolioDrawer');
    const drawerTitle = document.getElementById('portfolioDrawerTitle');
    const drawerIframe = document.getElementById('portfolioDrawerIframe');
    const drawerLoading = document.getElementById('portfolioDrawerLoading');
    const drawerClose = document.getElementById('portfolioDrawerClose');
    const drawerCloseBtn = document.getElementById('portfolioDrawerCloseBtn');
    const drawerOpenBtn = document.getElementById('portfolioDrawerOpenBtn');

    function openDrawer(url, title) {
      // Set title and URL
      drawerTitle.textContent = title;
      drawerOpenBtn.href = url;
      
      // Reset loading state
      drawerLoading.innerHTML = `
        <div class="portfolio-drawer-spinner"></div>
        <p>Loading project...</p>
      `;
      drawerLoading.style.display = 'flex';
      drawerIframe.style.display = 'none';
      
      // Open drawer
      drawerOverlay.classList.add('active');
      drawer.classList.add('active');
      document.body.style.overflow = 'hidden';
      
      // Load iframe
      drawerIframe.src = url;
      
      // Set timeout for loading (15 seconds)
      const loadTimeout = setTimeout(() => {
        if (drawerLoading.style.display !== 'none') {
          drawerLoading.innerHTML = `
            <div style="text-align: center;">
              <i class="fas fa-clock" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
              <p style="margin-bottom: 1rem;">This site is taking longer than expected to load.</p>
              <a href="${url}" target="_blank" class="btn btn-primary">Open in New Tab</a>
            </div>
          `;
        }
      }, 15000);
      
      // Hide loading when iframe loads
      drawerIframe.onload = () => {
        clearTimeout(loadTimeout);
        drawerLoading.style.display = 'none';
        drawerIframe.style.display = 'block';
      };
      
      // Handle iframe load errors
      drawerIframe.onerror = () => {
        clearTimeout(loadTimeout);
        drawerLoading.innerHTML = `
          <div style="text-align: center;">
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem;"></i>
            <p style="margin-bottom: 1rem;">Unable to load this site in the preview.</p>
            <a href="${url}" target="_blank" class="btn btn-primary">Open in New Tab</a>
          </div>
        `;
      };
    }

    function closeDrawer() {
      drawerOverlay.classList.remove('active');
      drawer.classList.remove('active');
      document.body.style.overflow = '';
      
      // Clear iframe after animation
      setTimeout(() => {
        drawerIframe.src = '';
        drawerLoading.style.display = 'flex';
        drawerIframe.style.display = 'none';
      }, 400);
    }

    // Open drawer on portfolio item click
    portfolioItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const url = item.getAttribute('data-portfolio-url');
        const title = item.getAttribute('data-portfolio-title');
        if (url) {
          openDrawer(url, title);
        }
      });
    });

    // Close drawer handlers
    drawerClose.addEventListener('click', closeDrawer);
    drawerCloseBtn.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    // Close drawer on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && drawer.classList.contains('active')) {
        closeDrawer();
      }
    });

    // Prevent iframe clicks from closing drawer
    drawer.addEventListener('click', (e) => {
      e.stopPropagation();
    });
  </script>
</body>
</html>
